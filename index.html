
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Buying List</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f3f4f6;
    color: #222;
    font-family: Arial, sans-serif;
}

header, #cardGrid, #emptyMessage, #status {
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
}

h1 {
    margin: 0 0 8px;
}

.instructions {
    color: #666;
    margin-bottom: 18px;
    line-height: 1.5;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

button {
    padding: 11px 15px;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

#addCard {
    background: #2563eb;
    color: white;
}

#saveImage {
    background: #15803d;
    color: white;
}

.remove-card {
    background: #fee2e2;
    color: #b91c1c;
    padding: 8px 10px;
}

#cardGrid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
    align-items: start;
}

.card {
    min-width: 0;
    padding: 10px;
    background: white;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
}

.card.dragging {
    opacity: 0.4;
}

.card.drag-over {
    border-color: #2563eb;
    background: #eff6ff;
}

.card-image-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #e5e7eb;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 12px;
}

.card-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.price-bubble {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    min-width: 110px;
    max-width: calc(100% - 12px);
    padding: 12px 18px;
    border-radius: 50px;
    background: #111827;
    color: white;
    border: 3px solid white;
    box-shadow: 0 3px 10px #0006;
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    white-space: nowrap;
    line-height: 1.2;
}

.image-upload {
    display: block;
    width: 100%;
    margin-bottom: 12px;
    font-size: 12px;
}

.field {
    margin-bottom: 10px;
}

.field label {
    display: block;
    margin-bottom: 5px;
    color: #555;
    font-size: 12px;
    font-weight: bold;
}

.field input {
    display: block;
    width: 100%;
    min-width: 0;
    padding: 10px 8px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    background: white;
    font-size: 16px;
}

.field input:focus,
.quantity-input:focus {
    outline: 2px solid #93c5fd;
    border-color: #2563eb;
}

.quantity-display {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 14px 0;
}

.quantity-x {
    font-size: 38px;
    font-weight: 900;
    line-height: 1;
}

.quantity-display .quantity-input {
    width: 100px;
    min-width: 0;
    padding: 8px;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    border: 2px solid #d1d5db;
    border-radius: 8px;
}

.quantity-display .quantity-input::placeholder {
    color: #9ca3af;
}

.card-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
}

.drag-handle {
    display: inline-block;
    padding: 8px;
    border-radius: 6px;
    background: #e5e7eb;
    color: #333;
    font-size: 12px;
    cursor: grab;
    user-select: none;
}

.drag-handle:active {
    cursor: grabbing;
}

#emptyMessage {
    margin-top: 25px;
    text-align: center;
    color: #777;
}

#status {
    margin-bottom: 12px;
    color: #555;
    font-size: 13px;
}

@media (max-width: 900px) {
    #cardGrid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

@media (max-width: 560px) {
    body {
        padding: 10px;
    }

    #cardGrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }

    .card {
        padding: 7px;
    }

    .price-bubble {
        min-width: 80px;
        padding: 9px 12px;
        font-size: 20px;
    }

    .quantity-display {
        gap: 6px;
    }

    .quantity-x {
        font-size: 30px;
    }

    .quantity-display .quantity-input {
        width: 75px;
        font-size: 25px;
    }
}

/* Export-only styles */
.export-grid {
    width: 1200px !important;
    max-width: none !important;
    grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
    gap: 14px !important;
    padding: 20px !important;
    background: white !important;
}

.export-grid .card {
    box-shadow: none;
    break-inside: avoid;
}

.export-grid .image-upload,
.export-grid .card-actions,
.export-grid .field label {
    display: none !important;
}

.export-grid .field {
    margin-top: 10px;
    margin-bottom: 0;
}

.export-grid .field input {
    border: none;
    background: transparent;
    padding: 4px 0;
    font-size: 18px;
    font-weight: bold;
    color: #111;
}

.export-grid .quantity-display {
    margin: 12px 0 4px;
}

.export-grid .quantity-display .quantity-input {
    border: none;
    background: transparent;
    font-size: 32px;
    color: #111;
    padding: 0;
}

.export-grid .quantity-x {
    font-size: 38px;
}

.export-grid .price-bubble {
    font-size: 26px;
}
</style>
</head>

<body>

<header>
    <h1>Card Buying List</h1>

    <div class="instructions">
        Upload your card photos, enter your target price in Thai baht,
        and enter the quantity beside the large ×. Drag cards to rearrange them.
    </div>

    <div class="toolbar">
        <button id="addCard" type="button">+ Add Card</button>
        <button id="saveImage" type="button">Save as JPEG</button>
    </div>
</header>

<div id="status" role="status"></div>

<main>
    <div id="cardGrid"></div>
    <div id="emptyMessage">No cards yet. Click “Add Card” to begin.</div>
</main>

<script>
const grid = document.getElementById("cardGrid");
const emptyMessage = document.getElementById("emptyMessage");
const statusMessage = document.getElementById("status");
const saveButton = document.getElementById("saveImage");

let draggedCard = null;

function updateEmptyMessage() {
    emptyMessage.style.display =
        grid.querySelector(".card") ? "none" : "block";
}

function formatBaht(value) {
    if (value === "") return "฿0";

    const number = Number(value);
    if (!Number.isFinite(number)) return "฿0";

    return "฿" + number.toLocaleString("en-US", {
        maximumFractionDigits: 2
    });
}

function updatePriceBubble(card) {
    const input = card.querySelector(".price-input");
    const bubble = card.querySelector(".price-bubble");
    bubble.textContent = formatBaht(input.value);
}

function createCard() {
    const card = document.createElement("section");
    card.className = "card";

    card.innerHTML = `
        <div class="card-image-wrap">
            <img class="card-image" alt="Card photo">
            <div class="price-bubble">฿0</div>
        </div>

        <input class="image-upload" type="file" accept="image/*"
               aria-label="Upload card photo">

        <div class="field">
            <label>Target price (THB)</label>
            <input class="price-input" type="number" min="0"
                   step="0.01" placeholder="Enter price in ฿">
        </div>

        <div class="quantity-display">
            <span class="quantity-x">×</span>
            <input class="quantity-input" type="number" min="0"
                   step="1" placeholder="0" aria-label="Quantity wanted">
        </div>

        <div class="card-actions">
            <span class="drag-handle" draggable="true"
                  title="Drag to rearrange">☰ Drag</span>
            <button class="remove-card" type="button"
                    aria-label="Remove card">✕</button>
        </div>
    `;

    const upload = card.querySelector(".image-upload");
    const image = card.querySelector(".card-image");
    const priceInput = card.querySelector(".price-input");
    const quantityInput = card.querySelector(".quantity-input");
    const dragHandle = card.querySelector(".drag-handle");

    upload.addEventListener("change", function() {
        const file = this.files && this.files[0];
        if (!file) return;

        if (!file.type.startsWith("image/")) {
            alert("Please choose an image file.");
            this.value = "";
            return;
        }

        const reader = new FileReader();

        reader.onload = function(event) {
            image.src = event.target.result;
        };

        reader.readAsDataURL(file);
    });

    priceInput.addEventListener("input", function() {
        updatePriceBubble(card);
    });

    card.querySelector(".remove-card").addEventListener("click", function() {
        card.remove();
        updateEmptyMessage();
    });

    // Drag using the dedicated handle.
    dragHandle.addEventListener("dragstart", function(event) {
        draggedCard = card;
        card.classList.add("dragging");

        if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", "card");
        }
    });

    dragHandle.addEventListener("dragend", function() {
        card.classList.remove("dragging");

        grid.querySelectorAll(".card").forEach(item => {
            item.classList.remove("drag-over");
        });

        draggedCard = null;
    });

    card.addEventListener("dragover", function(event) {
        if (!draggedCard || draggedCard === card) return;

        event.preventDefault();
        card.classList.add("drag-over");
    });

    card.addEventListener("dragleave", function(event) {
        if (!card.contains(event.relatedTarget)) {
            card.classList.remove("drag-over");
        }
    });

    card.addEventListener("drop", function(event) {
        event.preventDefault();
        card.classList.remove("drag-over");

        if (!draggedCard || draggedCard === card) return;

        const rect = card.getBoundingClientRect();
        const insertAfter = event.clientY > rect.top + rect.height / 2;

        if (insertAfter) {
            card.after(draggedCard);
        } else {
            card.before(draggedCard);
        }
    });

    grid.appendChild(card);
    updateEmptyMessage();

    return card;
}

document.getElementById("addCard").addEventListener("click", function() {
    const card = createCard();
    card.querySelector(".image-upload").focus();
});

function waitForImages(container) {
    const images = Array.from(container.querySelectorAll("img"));

    return Promise.all(images.map(img => {
        if (img.complete) return Promise.resolve();

        return new Promise(resolve => {
            img.onload = resolve;
            img.onerror = resolve;
        });
    }));
}

saveButton.addEventListener("click", async function() {
    if (typeof html2canvas !== "function") {
        alert("The JPEG library could not load. Check your internet connection and refresh the page.");
        return;
    }

    if (!grid.querySelector(".card")) {
        alert("Please add at least one card first.");
        return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "Creating JPEG...";
    statusMessage.textContent = "Preparing your image...";

    let exportGrid = null;

    try {
        // Clone the grid so exporting doesn't disturb the live page.
        exportGrid = grid.cloneNode(true);
        exportGrid.id = "exportGrid";
        exportGrid.classList.add("export-grid");

        const originalCards = Array.from(grid.querySelectorAll(".card"));
        const clonedCards = Array.from(exportGrid.querySelectorAll(".card"));

        originalCards.forEach((original, index) => {
            const copy = clonedCards[index];
            if (!copy) return;

            const originalImage = original.querySelector(".card-image");
            const copyImage = copy.querySelector(".card-image");

            if (originalImage.src) {
                copyImage.src = originalImage.src;
            }

            updatePriceBubble(original);

            // Copy live input values into visible text for the JPEG.
            const price = original.querySelector(".price-input").value.trim();
            const quantity = original.querySelector(".quantity-input").value.trim();

            const copiedPrice = copy.querySelector(".price-input");
            const priceText = document.createElement("div");
            priceText.textContent = price === "" ? "Price: —" : "Price: " + formatBaht(price);
            priceText.style.cssText =
                "font-size:18px;font-weight:bold;padding:4px 0;color:#111;overflow-wrap:anywhere;";
            copiedPrice.replaceWith(priceText);

            const copiedQuantity = copy.querySelector(".quantity-input");
            const quantityText = document.createElement("span");
            quantityText.textContent = quantity || "0";
            quantityText.style.cssText =
                "display:inline-block;min-width:75px;text-align:center;font-size:32px;font-weight:bold;color:#111;";
            copiedQuantity.replaceWith(quantityText);
        });

        exportGrid.style.position = "fixed";
        exportGrid.style.left = "-15000px";
        exportGrid.style.top = "0";
        exportGrid.style.zIndex = "-1";

        document.body.appendChild(exportGrid);

        await waitForImages(exportGrid);

        const canvas = await html2canvas(exportGrid, {
            backgroundColor: "#ffffff",
            scale: 2,
            logging: false,
            width: 1200,
            windowWidth: 1220
        });

        const blob = await new Promise(resolve => {
            canvas.toBlob(resolve, "image/jpeg", 0.95);
        });

        if (!blob) {
            throw new Error("Could not create JPEG.");
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "Card-Buying-List.jpg";
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 3000);
        statusMessage.textContent = "JPEG saved to your downloads.";

    } catch (error) {
        console.error("JPEG export error:", error);
        statusMessage.textContent = "JPEG export failed.";
        alert("Could not save the JPEG. Please refresh the page and try again.");
    } finally {
        if (exportGrid) exportGrid.remove();

        saveButton.disabled = false;
        saveButton.textContent = "Save as JPEG";
    }
});

// Begin with one empty card.
createCard();
</script>

</body>
</html>
