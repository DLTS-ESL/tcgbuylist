
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Buy List</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 24px;
    font-family: Arial, sans-serif;
    background: #f3f5f9;
    color: #222;
}

header {
    max-width: 1200px;
    margin: 0 auto 24px;
}

h1 { margin: 0 0 8px; font-size: 32px; }
.subtitle { color: #666; margin-bottom: 20px; }

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

button {
    padding: 12px 18px;
    border: 0;
    border-radius: 8px;
    background: #2463eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button.secondary { background: #555; }
button.delete { background: #dc3545; font-size: 13px; padding: 8px 12px; }

#saveStatus {
    margin-top: 12px;
    color: #287443;
    font-size: 14px;
}

#cardGrid {
    max-width: 1200px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 24px 16px;
}

.card-item { min-width: 0; }

.card-image-area {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: white;
    border: 2px dashed #c5cbd5;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
}

.card-image-area img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.placeholder {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #888;
    text-align: center;
    padding: 10px;
}

.fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
}

.field label {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
}

.field input {
    width: 100%;
    min-width: 0;
    height: 58px;
    padding: 6px;
    border: 2px solid #b9c2d0;
    border-radius: 8px;
    background: white;
    text-align: center;
    font-size: 23px;
    font-weight: bold;
}

.field input:focus {
    outline: 3px solid #a8c5ff;
    border-color: #2463eb;
}

.card-actions { text-align: center; margin-top: 10px; }

#emptyMessage {
    max-width: 1200px;
    margin: 40px auto;
    padding: 35px 20px;
    text-align: center;
    background: white;
    border-radius: 12px;
    color: #777;
}

@media (max-width: 850px) {
    #cardGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 500px) {
    body { padding: 12px; }
    h1 { font-size: 26px; }
    #cardGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; }
    .field input { font-size: 20px; height: 52px; }
    .field label { font-size: 12px; }
}

@media print {
    body { background: white; padding: 0; }
    .toolbar, .card-actions, #saveStatus, .subtitle { display: none !important; }
    #cardGrid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 15px 10px; }
    .card-image-area { border: 1px solid #ddd; }
    .field input { border: 1px solid #777; }
}
</style>
</head>

<body>
<header>
    <h1>🃏 Card Buy List</h1>
    <p class="subtitle">Add cards, enter the quantity you want and the price you are willing to pay.</p>

    <div class="toolbar">
        <button onclick="addCard()">+ Add Card</button>
        <button onclick="document.getElementById('imageUpload').click()">Upload Card Images</button>
        <button onclick="saveList()">💾 Save List</button>
        <button class="secondary" onclick="loadList()">Load Saved List</button>
        <button class="secondary" onclick="window.print()">Print List</button>
        <button class="secondary" onclick="clearList()">Clear All</button>
    </div>

    <input id="imageUpload" type="file" accept="image/*" multiple hidden>
    <div id="saveStatus" aria-live="polite"></div>
</header>

<main>
    <div id="cardGrid"></div>
    <div id="emptyMessage">
        No cards yet. Click <b>+ Add Card</b> or upload your card images.
    </div>
</main>

<script>
const grid = document.getElementById("cardGrid");
const statusText = document.getElementById("saveStatus");
const STORAGE_KEY = "cardBuyListSaved_v1";

function updateEmptyMessage() {
    document.getElementById("emptyMessage").style.display =
        grid.children.length ? "none" : "block";
}

function addCard(data = {}) {
    const item = document.createElement("div");
    item.className = "card-item";

    const imageArea = document.createElement("div");
    imageArea.className = "card-image-area";

    function showPlaceholder() {
        imageArea.innerHTML = "";
        const placeholder = document.createElement("div");
        placeholder.className = "placeholder";
        placeholder.textContent = "+ Add Card Image";
        imageArea.appendChild(placeholder);
    }

    function setImage(src) {
        imageArea.innerHTML = "";
        const img = document.createElement("img");
        img.alt = "Card image";
        img.src = src;
        imageArea.appendChild(img);
    }

    if (data.image) setImage(data.image);
    else showPlaceholder();

    imageArea.addEventListener("click", () => {
        const picker = document.createElement("input");
        picker.type = "file";
        picker.accept = "image/*";
        picker.onchange = () => {
            const file = picker.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = event => setImage(event.target.result);
            reader.readAsDataURL(file);
        };
        picker.click();
    });

    const fields = document.createElement("div");
    fields.className = "fields";

    function makeField(labelText, value, type, placeholder) {
        const wrapper = document.createElement("div");
        wrapper.className = "field";

        const label = document.createElement("label");
        label.textContent = labelText;

        const input = document.createElement("input");
        input.type = type;
        input.value = value ?? "";
        input.placeholder = placeholder;

        if (type === "number") {
            input.min = "0";
            input.step = "any";
        }

        label.appendChild(input);
        wrapper.appendChild(label);
        return { wrapper, input };
    }

    const quantity = makeField("× Quantity", data.quantity ?? "1", "number", "0");
    const price = makeField("Price", data.price ?? "", "text", "฿ / price");

    fields.append(quantity.wrapper, price.wrapper);

    const actions = document.createElement("div");
    actions.className = "card-actions";

    const remove = document.createElement("button");
    remove.className = "delete";
    remove.textContent = "Remove";
    remove.onclick = () => {
        item.remove();
        updateEmptyMessage();
    };

    actions.appendChild(remove);
    item.append(imageArea, fields, actions);
    grid.appendChild(item);

    updateEmptyMessage();
}

function getListData() {
    return Array.from(grid.children).map(item => {
        const img = item.querySelector(".card-image-area img");
        const inputs = item.querySelectorAll(".field input");
        return {
            image: img ? img.src : "",
            quantity: inputs[0].value,
            price: inputs[1].value
        };
    });
}

function saveList() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(getListData()));
        statusText.textContent = "✓ List saved on this browser and device.";
    } catch (error) {
        statusText.textContent =
            "Unable to save. Your images may be too large; try fewer or smaller images.";
    }
}

function loadList() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved === null) {
            statusText.textContent = "No saved list found on this browser.";
            return;
        }

        grid.innerHTML = "";
        JSON.parse(saved).forEach(data => addCard(data));
        statusText.textContent = "✓ Saved list loaded.";
    } catch (error) {
        statusText.textContent = "Could not load the saved list.";
    }
}

function clearList() {
    if (!confirm("Clear all cards from the current list?")) return;
    grid.innerHTML = "";
    updateEmptyMessage();
    statusText.textContent = "Current list cleared. Your saved copy remains until overwritten.";
}

document.getElementById("imageUpload").addEventListener("change", event => {
    Array.from(event.target.files).forEach(file => {
        if (!file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = e => addCard({ image: e.target.result, quantity: "1", price: "" });
        reader.readAsDataURL(file);
    });
    event.target.value = "";
});

loadList();
updateEmptyMessage();
</script>
</body>
</html>
