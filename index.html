
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Buying List</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f3f4f6;
    color: #222;
    font-family: Arial, sans-serif;
}

header, #cardGrid, #status {
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
}

h1 {
    margin: 0 0 8px;
}

.instructions {
    color: #666;
    line-height: 1.5;
    margin-bottom: 16px;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}

button {
    padding: 11px 15px;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

#uploadMultiple, #addCard {
    background: #2563eb;
    color: white;
}

#saveImage {
    background: #15803d;
    color: white;
}

.remove-card {
    background: #fee2e2;
    color: #b91c1c;
    padding: 8px 10px;
}

#multiUpload {
    display: none;
}

#status {
    margin-bottom: 12px;
    color: #555;
    font-size: 13px;
}

#cardGrid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
    align-items: start;
}

.card {
    min-width: 0;
    padding: 10px;
    background: white;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
}

.card.dragging {
    opacity: 0.4;
}

.card.drag-over {
    border-color: #2563eb;
}

.card-image-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #e5e7eb;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 12px;
}

.card-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
}

.price-bubble {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    min-width: 110px;
    max-width: calc(100% - 10px);
    padding: 12px 15px;
    border-radius: 50px;
    background: #111827;
    color: white;
    border: 3px solid white;
    box-shadow: 0 3px 10px #0006;
    text-align: center;
    font-size: 27px;
    font-weight: 900;
    white-space: nowrap;
}

.image-upload {
    display: block;
    width: 100%;
    margin-bottom: 12px;
    font-size: 12px;
}

.field {
    margin-bottom: 10px;
}

.field label {
    display: block;
    margin-bottom: 5px;
    color: #555;
    font-size: 12px;
    font-weight: bold;
}

.field input {
    display: block;
    width: 100%;
    min-width: 0;
    padding: 10px 8px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    background: white;
    font-size: 16px;
}

.quantity-display {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 14px 0;
}

.quantity-x {
    font-size: 42px;
    font-weight: 900;
    line-height: 1;
}

.quantity-input {
    width: 100px;
    min-width: 0;
    padding: 8px;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    border: 2px solid #d1d5db;
    border-radius: 8px;
}

.card-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
}

.drag-handle {
    display: inline-block;
    padding: 8px;
    border-radius: 6px;
    background: #e5e7eb;
    font-size: 12px;
    cursor: grab;
    user-select: none;
}

/* Exported JPEG: fixed width, exactly five columns */
.export-grid {
    width: 1800px !important;
    max-width: none !important;
    display: grid !important;
    grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
    gap: 18px !important;
    padding: 18px !important;
    margin: 0 !important;
    background: #f3f4f6 !important;
    align-items: start !important;
}

.export-grid .card {
    width: auto !important;
    min-width: 0 !important;
    padding: 12px !important;
    opacity: 1 !important;
    border: 2px solid #e5e7eb !important;
    border-radius: 12px !important;
    background: #fff !important;
}

.export-grid .image-upload,
.export-grid .card-actions,
.export-grid .field label {
    display: none !important;
}

.export-grid .card-image-wrap {
    width: 100% !important;
    aspect-ratio: 3 / 4 !important;
    margin-bottom: 12px !important;
}

.export-grid .price-bubble {
    font-size: 38px !important;
    font-weight: 900 !important;
    padding: 15px 18px !important;
    min-width: 140px !important;
    bottom: 12px !important;
}

.export-grid .field {
    margin: 10px 0 !important;
}

.export-grid .price-input,
.export-grid .price-display {
    display: block !important;
    width: 100% !important;
    height: auto !important;
    padding: 6px 0 !important;
    border: none !important;
    background: transparent !important;
    font-family: Arial, sans-serif !important;
    font-size: 34px !important;
    line-height: 1.2 !important;
    font-weight: 900 !important;
    text-align: center !important;
    color: #111 !important;
    overflow-wrap: anywhere !important;
}

.export-grid .quantity-display {
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 12px !important;
    margin: 16px 0 !important;
}

.export-grid .quantity-x {
    font-size: 54px !important;
    line-height: 1 !important;
    font-weight: 900 !important;
}

.export-grid .quantity-input,
.export-grid .quantity-text {
    display: block !important;
    width: 120px !important;
    height: auto !important;
    padding: 0 !important;
    border: none !important;
    background: transparent !important;
    font-family: Arial, sans-serif !important;
    font-size: 48px !important;
    line-height: 1.2 !important;
    font-weight: 900 !important;
    text-align: center !important;
    color: #111 !important;
}

@media (max-width: 900px) {
    #cardGrid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

@media (max-width: 560px) {
    body {
        padding: 10px;
    }

    #cardGrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }

    .card {
        padding: 7px;
    }

    .price-bubble {
        font-size: 19px;
        min-width: 80px;
        padding: 8px 10px;
    }

    .quantity-x {
        font-size: 30px;
    }

    .quantity-input {
        width: 72px;
        font-size: 25px;
    }
}
</style>
</head>

<body>
<header>
    <h1>Card Buying List</h1>

    <div class="instructions">
        Upload multiple card photos at once. Enter your target price in THB
        and the quantity you want. Drag cards to rearrange them.
    </div>

    <div class="toolbar">
        <button id="uploadMultiple" type="button">Upload Multiple Cards</button>
        <input id="multiUpload" type="file" accept="image/*" multiple>
        <button id="addCard" type="button">+ Add One Card</button>
        <button id="saveImage" type="button">Save as JPEG</button>
    </div>
</header>

<div id="status" role="status"></div>

<main>
    <div id="cardGrid"></div>
</main>

<script>
const grid = document.getElementById("cardGrid");
const multiUpload = document.getElementById("multiUpload");
const statusMessage = document.getElementById("status");
const saveButton = document.getElementById("saveImage");

let draggedCard = null;

function formatBaht(value) {
    if (value === "") return "฿0";

    const number = Number(value);
    if (!Number.isFinite(number)) return "฿0";

    return "฿" + number.toLocaleString("en-US", {
        maximumFractionDigits: 2
    });
}

function updatePriceBubble(card) {
    const input = card.querySelector(".price-input");
    card.querySelector(".price-bubble").textContent = formatBaht(input.value);
}

function createCard(imageData = "") {
    const card = document.createElement("section");
    card.className = "card";

    card.innerHTML = `
        <div class="card-image-wrap">
            <img class="card-image" alt="Trading card">
            <div class="price-bubble">฿0</div>
        </div>

        <input class="image-upload" type="file" accept="image/*"
               aria-label="Replace card photo">

        <div class="field">
            <label>Target price (THB)</label>
            <input class="price-input" type="number" min="0" step="0.01"
                   placeholder="Price in ฿">
        </div>

        <div class="quantity-display">
            <span class="quantity-x">×</span>
            <input class="quantity-input" type="number" min="0" step="1"
                   placeholder="0" aria-label="Quantity wanted">
        </div>

        <div class="card-actions">
            <span class="drag-handle" draggable="true">☰ Drag</span>
            <button class="remove-card" type="button">✕ Remove</button>
        </div>
    `;

    const image = card.querySelector(".card-image");
    const upload = card.querySelector(".image-upload");
    const priceInput = card.querySelector(".price-input");
    const dragHandle = card.querySelector(".drag-handle");

    if (imageData) image.src = imageData;

    upload.addEventListener("change", function() {
        const file = this.files && this.files[0];
        if (!file) return;

        if (!file.type.startsWith("image/")) {
            alert("Please select an image file.");
            this.value = "";
            return;
        }

        const reader = new FileReader();

        reader.onload = event => {
            image.src = event.target.result;
        };

        reader.readAsDataURL(file);
    });

    priceInput.addEventListener("input", () => updatePriceBubble(card));

    card.querySelector(".remove-card").addEventListener("click", () => {
        card.remove();
    });

    dragHandle.addEventListener("dragstart", event => {
        draggedCard = card;
        card.classList.add("dragging");

        if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", "card");
        }
    });

    dragHandle.addEventListener("dragend", () => {
        card.classList.remove("dragging");

        grid.querySelectorAll(".card").forEach(item => {
            item.classList.remove("drag-over");
        });

        draggedCard = null;
    });

    card.addEventListener("dragover", event => {
        if (!draggedCard || draggedCard === card) return;
        event.preventDefault();
        card.classList.add("drag-over");
    });

    card.addEventListener("dragleave", event => {
        if (!card.contains(event.relatedTarget)) {
            card.classList.remove("drag-over");
        }
    });

    card.addEventListener("drop", event => {
        event.preventDefault();
        card.classList.remove("drag-over");

        if (!draggedCard || draggedCard === card) return;

        const rect = card.getBoundingClientRect();

        if (event.clientY > rect.top + rect.height / 2) {
            card.after(draggedCard);
        } else {
            card.before(draggedCard);
        }
    });

    grid.appendChild(card);
    return card;
}

document.getElementById("uploadMultiple").addEventListener("click", () => {
    multiUpload.click();
});

multiUpload.addEventListener("change", function() {
    const files = Array.from(this.files || []).filter(file =>
        file.type.startsWith("image/")
    );

    if (!files.length) return;

    let completed = 0;
    let added = 0;

    files.forEach(file => {
        const reader = new FileReader();

        reader.onload = event => {
            createCard(event.target.result);
            added++;
            completed++;

            if (completed === files.length) {
                statusMessage.textContent = added + " card photo(s) added.";
            }
        };

        reader.onerror = () => {
            completed++;

            if (completed === files.length) {
                statusMessage.textContent =
                    added + " photo(s) added. Some photos could not be loaded.";
            }
        };

        reader.readAsDataURL(file);
    });

    this.value = "";
});

document.getElementById("addCard").addEventListener("click", () => {
    const card = createCard();
    card.querySelector(".image-upload").focus();
});

function waitForImages(container) {
    return Promise.all(
        Array.from(container.querySelectorAll("img")).map(img => {
            if (img.complete) return Promise.resolve();

            return new Promise(resolve => {
                img.onload = resolve;
                img.onerror = resolve;
            });
        })
    );
}

saveButton.addEventListener("click", async () => {
    if (typeof html2canvas !== "function") {
        alert("JPEG library failed to load. Check your internet connection and refresh.");
        return;
    }

    const cards = Array.from(grid.querySelectorAll(".card"));

    if (!cards.length) {
        alert("Please add at least one card first.");
        return;
    }

    let exportGrid = null;

    saveButton.disabled = true;
    saveButton.textContent = "Creating JPEG...";

    try {
        exportGrid = grid.cloneNode(true);
        exportGrid.id = "exportGrid";
        exportGrid.classList.add("export-grid");

        exportGrid.style.position = "fixed";
        exportGrid.style.left = "-20000px";
        exportGrid.style.top = "0";
        exportGrid.style.zIndex = "-1";

        const copies = Array.from(exportGrid.querySelectorAll(".card"));

        cards.forEach((original, index) => {
            const copy = copies[index];
            if (!copy) return;

            const originalImage = original.querySelector(".card-image");
            const copiedImage = copy.querySelector(".card-image");

            if (originalImage.src) {
                copiedImage.src = originalImage.src;
            }

            copy.querySelector(".price-bubble").textContent =
                original.querySelector(".price-bubble").textContent;

            // Use large static text for the exported price.
            const priceInput = original.querySelector(".price-input");
            const priceDisplay = document.createElement("div");
            priceDisplay.className = "price-display";
            priceDisplay.textContent = priceInput.value === ""
                ? "—"
                : formatBaht(priceInput.value);

            copy.querySelector(".price-input").replaceWith(priceDisplay);

            // Use large static text for the exported quantity.
            const quantityInput = original.querySelector(".quantity-input");
            const quantityText = document.createElement("div");
            quantityText.className = "quantity-text";
            quantityText.textContent = quantityInput.value || "0";

            copy.querySelector(".quantity-input").replaceWith(quantityText);
        });

        // Hide editing controls, not the price or quantity.
        exportGrid.querySelectorAll(
            ".image-upload, .card-actions, .field label"
        ).forEach(element => element.remove());

        document.body.appendChild(exportGrid);

        await waitForImages(exportGrid);

        // Render at high resolution, keeping five cards in every row.
        const canvas = await html2canvas(exportGrid, {
            backgroundColor: "#f3f4f6",
            scale: 2,
            width: 1800,
            windowWidth: 1840,
            logging: false
        });

        const blob = await new Promise(resolve => {
            canvas.toBlob(resolve, "image/jpeg", 0.95);
        });

        if (!blob) throw new Error("Could not create JPEG.");

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "Card-Buying-List.jpg";
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 3000);
        statusMessage.textContent = "JPEG saved successfully.";

    } catch (error) {
        console.error("JPEG export error:", error);
        alert("Could not save the JPEG. Please refresh and try again.");
    } finally {
        if (exportGrid) exportGrid.remove();

        saveButton.disabled = false;
        saveButton.textContent = "Save as JPEG";
    }
});

// Start with one empty card.
createCard();
</script>
</body>
</html>
