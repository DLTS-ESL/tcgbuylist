
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Buy List</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 24px;
    font-family: Arial, sans-serif;
    background: #f2f4f8;
    color: #222;
}

header {
    max-width: 1200px;
    margin: 0 auto 24px;
}

h1 { margin: 0 0 8px; font-size: 32px; }
.subtitle { color: #666; margin: 0 0 20px; }

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

button {
    padding: 12px 18px;
    border: 0;
    border-radius: 8px;
    background: #2463eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button.secondary { background: #555; }
button.delete { background: #dc3545; font-size: 13px; padding: 8px 12px; }

#status {
    margin-top: 12px;
    color: #287443;
    font-size: 14px;
}

#cardGrid {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 24px 16px;
    align-items: start;
}

.card-item { min-width: 0; }

.card-image-area {
    width: 100%;
    aspect-ratio: 3 / 4;
    position: relative;
    overflow: hidden;
    background: white;
    border: 2px dashed #c5cbd5;
    border-radius: 10px;
    cursor: pointer;
}

.card-image-area img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.placeholder {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    text-align: center;
    color: #888;
}

.fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
}

.field { min-width: 0; }

.field label {
    display: block;
    text-align: center;
    margin-bottom: 5px;
    font-size: 14px;
    font-weight: bold;
}

.field input {
    display: block;
    width: 100%;
    min-width: 0;
    height: 58px;
    padding: 6px;
    border: 2px solid #b9c2d0;
    border-radius: 8px;
    background: white;
    color: #111;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 23px;
    font-weight: bold;
}

.field input:focus {
    outline: 3px solid #a8c5ff;
    border-color: #2463eb;
}

.card-actions {
    margin-top: 10px;
    text-align: center;
}

#emptyMessage {
    max-width: 1200px;
    margin: 40px auto;
    padding: 40px 20px;
    text-align: center;
    background: white;
    border-radius: 12px;
    color: #777;
}

@media (max-width: 850px) {
    #cardGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 500px) {
    body { padding: 12px; }
    h1 { font-size: 26px; }
    #cardGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; }
    .field input { height: 52px; font-size: 20px; }
    .field label { font-size: 12px; }
}

/* Applied only temporarily while creating the JPEG */
body.exporting {
    background: white;
}

body.exporting header,
body.exporting #emptyMessage,
body.exporting .card-actions {
    display: none !important;
}

body.exporting #cardGrid {
    width: 1200px !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 24px !important;
    grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
    gap: 24px 16px !important;
    background: white;
}

body.exporting .card-image-area {
    border: none !important;
    border-radius: 0 !important;
    cursor: default;
}

body.exporting .fields {
    margin-top: 8px;
    gap: 4px;
}

body.exporting .field label {
    font-size: 16px;
    color: #111;
}

body.exporting .field input {
    height: auto !important;
    min-height: 0 !important;
    padding: 0 !important;
    border: none !important;
    border-radius: 0 !important;
    outline: none !important;
    box-shadow: none !important;
    background: transparent !important;
    color: #111 !important;
    font-size: 22px !important;
    font-weight: bold;
    appearance: none;
    -webkit-appearance: none;
}
</style>
</head>

<body>
<header>
    <h1>🃏 Card Buy List</h1>
    <p class="subtitle">
        Add cards, enter your desired quantity and price, then export the complete list as one JPEG.
    </p>

    <div class="toolbar">
        <button type="button" onclick="addCard()">+ Add Card</button>
        <button type="button" onclick="document.getElementById('imageUpload').click()">Upload Card Images</button>
        <button type="button" onclick="exportJPEG()">📷 Save as JPEG</button>
        <button type="button" class="secondary" onclick="window.print()">Print</button>
        <button type="button" class="secondary" onclick="clearList()">Clear All</button>
    </div>

    <input id="imageUpload" type="file" accept="image/*" multiple hidden>
    <div id="status" aria-live="polite"></div>
</header>

<main>
    <div id="cardGrid"></div>
    <div id="emptyMessage">
        <strong>No cards added yet.</strong>
        <p>Click Add Card or Upload Card Images to begin.</p>
    </div>
</main>

<script>
const grid = document.getElementById("cardGrid");
const statusText = document.getElementById("status");

function updateEmptyMessage() {
    document.getElementById("emptyMessage").style.display =
        grid.children.length ? "none" : "block";
}

function addCard(data = {}) {
    const item = document.createElement("div");
    item.className = "card-item";

    const imageArea = document.createElement("div");
    imageArea.className = "card-image-area";

    function showPlaceholder() {
        imageArea.innerHTML = "";
        const placeholder = document.createElement("div");
        placeholder.className = "placeholder";
        placeholder.textContent = "+ Add Card Image";
        imageArea.appendChild(placeholder);
    }

    function setImage(src) {
        imageArea.innerHTML = "";
        const img = document.createElement("img");
        img.src = src;
        img.alt = "Card image";
        imageArea.appendChild(img);
    }

    if (data.image) setImage(data.image);
    else showPlaceholder();

    imageArea.addEventListener("click", () => {
        const picker = document.createElement("input");
        picker.type = "file";
        picker.accept = "image/*";

        picker.onchange = () => {
            const file = picker.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = event => setImage(event.target.result);
            reader.readAsDataURL(file);
        };

        picker.click();
    });

    const fields = document.createElement("div");
    fields.className = "fields";

    function createField(labelText, value, placeholder, type) {
        const wrapper = document.createElement("div");
        wrapper.className = "field";

        const label = document.createElement("label");
        label.textContent = labelText;

        const input = document.createElement("input");
        input.type = type;
        input.value = value ?? "";
        input.placeholder = placeholder;
        input.autocomplete = "off";
        input.setAttribute("aria-label", labelText);

        if (type === "number") {
            input.min = "0";
            input.step = "1";
        }

        label.appendChild(input);
        wrapper.appendChild(label);
        return wrapper;
    }

    const quantity = createField("× Quantity", data.quantity ?? "1", "0", "number");
    const price = createField("Price", data.price ?? "", "฿", "text");

    fields.append(quantity, price);

    const actions = document.createElement("div");
    actions.className = "card-actions";

    const removeButton = document.createElement("button");
    removeButton.type = "button";
    removeButton.className = "delete";
    removeButton.textContent = "Remove";
    removeButton.onclick = () => {
        item.remove();
        updateEmptyMessage();
    };

    actions.appendChild(removeButton);
    item.append(imageArea, fields, actions);
    grid.appendChild(item);
    updateEmptyMessage();
}

/* Upload multiple card photos */
document.getElementById("imageUpload").addEventListener("change", event => {
    Array.from(event.target.files || []).forEach(file => {
        if (!file.type.startsWith("image/")) return;

        const reader = new FileReader();
        reader.onload = e => addCard({
            image: e.target.result,
            quantity: "1",
            price: ""
        });
        reader.readAsDataURL(file);
    });

    event.target.value = "";
});

/* Wait for all card images before exporting */
async function waitForImages(container) {
    const images = Array.from(container.querySelectorAll("img"));

    await Promise.all(images.map(img => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();

        return new Promise(resolve => {
            img.onload = resolve;
            img.onerror = resolve;
        });
    }));
}

/* Export the entire card grid as ONE JPEG */
async function exportJPEG() {
    if (!grid.children.length) {
        alert("Please add at least one card first.");
        return;
    }

    if (typeof html2canvas === "undefined") {
        alert("The export library did not load. Check your internet connection and try again.");
        return;
    }

    const button = document.querySelector('button[onclick="exportJPEG()"]');
    button.disabled = true;
    button.textContent = "Creating JPEG...";
    statusText.textContent = "Preparing the complete image...";

    const originalScroll = window.scrollY;

    try {
        await waitForImages(grid);

        document.body.classList.add("exporting");

        await new Promise(resolve =>
            requestAnimationFrame(() =>
                requestAnimationFrame(resolve)
            )
        );

        const canvas = await html2canvas(grid, {
            backgroundColor: "#ffffff",
            scale: 2,
            useCORS: true,
            logging: false,
            width: grid.scrollWidth,
            height: grid.scrollHeight,
            windowWidth: 1250,
            windowHeight: Math.max(grid.scrollHeight, 900),
            scrollX: 0,
            scrollY: 0
        });

        const blob = await new Promise(resolve =>
            canvas.toBlob(resolve, "image/jpeg", 0.95)
        );

        if (!blob) throw new Error("JPEG creation failed.");

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "Card-Buy-List.jpg";
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 5000);

        statusText.textContent = "✓ One complete JPEG image has been downloaded.";
    } catch (error) {
        console.error(error);
        statusText.textContent = "Export failed. Try fewer or smaller card images.";
        alert("Could not create the JPEG. Try fewer cards or smaller images.");
    } finally {
        document.body.classList.remove("exporting");
        button.disabled = false;
        button.textContent = "📷 Save as JPEG";
        window.scrollTo(0, originalScroll);
    }
}

function clearList() {
    if (!confirm("Remove all cards from this page?")) return;
    grid.innerHTML = "";
    statusText.textContent = "";
    updateEmptyMessage();
}

updateEmptyMessage();
</script>
</body>
</html>
