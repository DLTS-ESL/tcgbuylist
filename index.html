
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Buying List</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f3f4f6;
    color: #222;
}

header {
    max-width: 1200px;
    margin: 0 auto 20px;
}

h1 {
    margin: 0 0 8px;
    font-size: 26px;
}

.instructions {
    color: #666;
    font-size: 14px;
    margin-bottom: 16px;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

#addCard {
    background: #2563eb;
    color: white;
}

#saveImage {
    background: #15803d;
    color: white;
}

.remove-card {
    background: #fee2e2;
    color: #b91c1c;
    padding: 7px 10px;
}

#cardGrid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 16px;
    align-items: start;
}

.card {
    min-width: 0;
    background: white;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 2px 6px #0000000d;
}

.card.dragging {
    opacity: 0.4;
}

.card.drag-over {
    border-color: #2563eb;
    background: #eff6ff;
}

.card-image-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #f3f4f6;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 10px;
}

.card-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.quantity-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    min-width: 38px;
    height: 38px;
    padding: 0 8px;
    border-radius: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111827;
    color: white;
    border: 2px solid white;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 2px 6px #0005;
    pointer-events: none;
}

.quantity-badge:empty {
    display: none;
}

.field {
    margin-bottom: 10px;
}

.field label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #555;
    margin-bottom: 5px;
}

.field input {
    width: 100%;
    padding: 10px 8px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    font-size: 16px;
    background: white;
    color: #111;
}

.field input:focus {
    outline: 2px solid #93c5fd;
    border-color: #2563eb;
}

.image-upload {
    width: 100%;
    font-size: 12px;
    margin-bottom: 10px;
}

.card-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
}

.drag-handle {
    font-size: 12px;
    color: #777;
    cursor: grab;
    user-select: none;
}

.empty-message {
    max-width: 1200px;
    margin: 25px auto;
    color: #777;
    text-align: center;
}

@media (max-width: 900px) {
    #cardGrid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

@media (max-width: 560px) {
    body {
        padding: 10px;
    }

    #cardGrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .card {
        padding: 8px;
    }
}

/* JPEG export styling */
.export-mode {
    width: 1200px !important;
    max-width: none !important;
    grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
    gap: 16px !important;
    background: white !important;
    padding: 20px !important;
}

.export-mode .card {
    break-inside: avoid;
    box-shadow: none;
}

.export-mode .remove-card,
.export-mode .drag-handle,
.export-mode .image-upload,
.export-mode .field label {
    display: none !important;
}

.export-mode .field {
    margin-top: 8px;
    margin-bottom: 0;
}

.export-mode .field input {
    border: none;
    background: transparent;
    padding: 4px 0;
    font-size: 18px;
    font-weight: bold;
    pointer-events: none;
}

.export-mode .quantity-badge {
    display: flex;
}

.export-mode .card-image-wrap {
    margin-bottom: 6px;
}
</style>
</head>

<body>

<header>
    <h1>Card Buying List</h1>
    <div class="instructions">
        Upload card photos, enter the quantity and price you want to buy,
        and drag cards to rearrange them. Up to 5 cards per row.
    </div>

    <div class="toolbar">
        <button id="addCard" type="button">+ Add Card</button>
        <button id="saveImage" type="button">Save as JPEG</button>
    </div>
</header>

<main>
    <div id="cardGrid"></div>
    <div id="emptyMessage" class="empty-message">
        No cards yet. Click “Add Card” to begin.
    </div>
</main>

<script>
const grid = document.getElementById("cardGrid");
const emptyMessage = document.getElementById("emptyMessage");
const addButton = document.getElementById("addCard");
const saveButton = document.getElementById("saveImage");

let draggedCard = null;
let cardCounter = 0;

function updateEmptyMessage() {
    emptyMessage.style.display =
        grid.querySelector(".card") ? "none" : "block";
}

function updateQuantityBadge(card) {
    const quantity = card.querySelector(".quantity-input").value.trim();
    const badge = card.querySelector(".quantity-badge");
    badge.textContent = quantity;
}

function createCard() {
    cardCounter++;

    const card = document.createElement("section");
    card.className = "card";
    card.draggable = true;

    card.innerHTML = `
        <div class="card-image-wrap">
            <img class="card-image" alt="Card photo">
            <div class="quantity-badge"></div>
        </div>

        <input class="image-upload" type="file" accept="image/*"
               aria-label="Upload card photo">

        <div class="field">
            <label>Quantity wanted</label>
            <input class="quantity-input" type="text"
                   inputmode="numeric" placeholder="How many?"
                   autocomplete="off">
        </div>

        <div class="field">
            <label>Price per card</label>
            <input class="price-input" type="text"
                   inputmode="decimal" placeholder="Your price"
                   autocomplete="off">
        </div>

        <div class="card-actions">
            <span class="drag-handle" title="Drag to rearrange">☰ Drag</span>
            <button class="remove-card" type="button">✕</button>
        </div>
    `;

    const upload = card.querySelector(".image-upload");
    const image = card.querySelector(".card-image");
    const quantityInput = card.querySelector(".quantity-input");
    const removeButton = card.querySelector(".remove-card");

    upload.addEventListener("change", function() {
        const file = this.files && this.files[0];
        if (!file) return;

        if (!file.type.startsWith("image/")) {
            alert("Please choose an image file.");
            this.value = "";
            return;
        }

        const reader = new FileReader();
        reader.onload = function(event) {
            image.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    quantityInput.addEventListener("input", function() {
        updateQuantityBadge(card);
    });

    removeButton.addEventListener("click", function() {
        card.remove();
        updateEmptyMessage();
    });

    // Drag-and-drop card reordering
    card.addEventListener("dragstart", function(event) {
        if (event.target.closest("input, button")) {
            event.preventDefault();
            return;
        }

        draggedCard = card;
        card.classList.add("dragging");

        if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", "card");
        }
    });

    card.addEventListener("dragend", function() {
        card.classList.remove("dragging");
        grid.querySelectorAll(".card").forEach(item => {
            item.classList.remove("drag-over");
        });
        draggedCard = null;
    });

    card.addEventListener("dragover", function(event) {
        if (!draggedCard || draggedCard === card) return;

        event.preventDefault();
        card.classList.add("drag-over");
    });

    card.addEventListener("dragleave", function() {
        card.classList.remove("drag-over");
    });

    card.addEventListener("drop", function(event) {
        event.preventDefault();
        card.classList.remove("drag-over");

        if (!draggedCard || draggedCard === card) return;

        const cards = Array.from(grid.querySelectorAll(".card"));
        const draggedIndex = cards.indexOf(draggedCard);
        const targetIndex = cards.indexOf(card);

        if (draggedIndex < targetIndex) {
            card.after(draggedCard);
        } else {
            card.before(draggedCard);
        }
    });

    grid.appendChild(card);
    updateEmptyMessage();

    return card;
}

addButton.addEventListener("click", function() {
    const card = createCard();
    card.querySelector(".image-upload").focus();
});

saveButton.addEventListener("click", async function() {
    if (typeof html2canvas === "undefined") {
        alert("The image-saving library did not load. Check your internet connection and try again.");
        return;
    }

    if (!grid.querySelector(".card")) {
        alert("Please add at least one card first.");
        return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "Creating JPEG...";

    try {
        // Update badges immediately before capturing the image
        grid.querySelectorAll(".card").forEach(updateQuantityBadge);

        grid.classList.add("export-mode");

        // Wait briefly for layout and image rendering
        await new Promise(resolve => setTimeout(resolve, 150));

        const canvas = await html2canvas(grid, {
            backgroundColor: "#ffffff",
            scale: 2,
            useCORS: true,
            logging: false
        });

        const link = document.createElement("a");
        link.download = "Card-Buying-List.jpg";
        link.href = canvas.toDataURL("image/jpeg", 0.95);
        link.click();

    } catch (error) {
        console.error(error);
        alert("Could not create the JPEG. Please try again.");
    } finally {
        grid.classList.remove("export-mode");
        saveButton.disabled = false;
        saveButton.textContent = "Save as JPEG";
    }
});

// Start with one blank card
createCard();
</script>

</body>
</html>
